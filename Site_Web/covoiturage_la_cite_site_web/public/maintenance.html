<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance — Covoiturage La Cité</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #08316e 0%, #1a5cb0 100%);
      color: #fff;
      padding: 2rem;
    }
    .container {
      max-width: 520px;
      text-align: center;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 9999px;
      padding: 0.5rem 1.25rem;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.025em;
    }
    .retry {
      margin-top: 2rem;
    }
    .retry a {
      color: #fff;
      text-decoration: underline;
      font-weight: 600;
    }
    .retry a:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔧</div>
    <h1>Maintenance en cours</h1>
    <p>
      Covoiturage La Cité est temporairement indisponible pour maintenance.
      Nous revenons rapidement. Merci de votre patience !
    </p>
    <div class="badge">Prévu de courte durée</div>
    <div class="retry">
      <a href="/">Rafraîchir la page</a>
    </div>
  </div>
</body>
</html>
