<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map Services</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <style>
    html, body, #map {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f2f5fa;
    }
    .leaflet-container {
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const map = L.map('map', { zoomControl: true }).setView([45.4215, -75.6972], 12);
 L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  maxZoom: 19,
  subdomains: 'abcd',
  attribution: '© <a href="https://carto.com/attributions" target="_blank">CARTO</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
}).addTo(map);

    let circuits = [];
    let activeIndex = 0;
    let routeLayer = null;
    let markerLayer = L.layerGroup().addTo(map);

    function notify(type, payload = {}) {
      if (window.MapBridge && typeof window.MapBridge.postMessage === 'function') {
        window.MapBridge.postMessage(JSON.stringify({ type, ...payload }));
      }
    }

    function normalize(points) {
      if (!Array.isArray(points)) return [];
      return points
        .map((p) => {
          if (Array.isArray(p) && p.length >= 2) {
            let first = Number(p[0]);
            let second = Number(p[1]);
            if (!Number.isFinite(first) || !Number.isFinite(second)) return null;

            // Accepte [lat,lng] et [lng,lat]. Si ambigu, on prefere [lng,lat]
            // car les APIs de routing retournent souvent ce format.
            let lat = first;
            let lng = second;
            const looksLikeLngLat = Math.abs(first) > 60 && Math.abs(second) <= 90;
            if (looksLikeLngLat) {
              lat = second;
              lng = first;
            }
            if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
            if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
            return { lat, lng };
          }
          if (p && typeof p === 'object') {
            const lat = Number(p.lat ?? p.latitude ?? 0);
            const lng = Number(p.lng ?? p.lon ?? p.longitude ?? 0);
            if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
            if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
            return { lat, lng };
          }
          return null;
        })
        .filter((p) => p && (p.lat !== 0 || p.lng !== 0));
    }

    function clearRoute() {
      if (routeLayer) {
        map.removeLayer(routeLayer);
        routeLayer = null;
      }
      markerLayer.clearLayers();
    }

    function drawRoute(points, fit = true) {
      clearRoute();
      const latLngs = normalize(points).map((p) => [p.lat, p.lng]);
      if (latLngs.length === 0) return;

      try {
        routeLayer = L.polyline(latLngs, {
          color: '#1A56CC',
          weight: 5,
          opacity: 0.9,
        }).addTo(map);
      } catch (_) {
        return;
      }

      const start = latLngs[0];
      const end = latLngs[latLngs.length - 1];
      L.circleMarker(start, {
        radius: 7,
        color: '#0F6E56',
        fillColor: '#0F6E56',
        fillOpacity: 1,
        weight: 2,
      }).addTo(markerLayer);
      L.circleMarker(end, {
        radius: 7,
        color: '#E24B4A',
        fillColor: '#E24B4A',
        fillOpacity: 1,
        weight: 2,
      }).addTo(markerLayer);

      if (fit) {
        const bounds = L.latLngBounds(latLngs);
        map.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
      }
    }

    function drawCircuit(index) {
      if (!Array.isArray(circuits) || circuits.length === 0) {
        clearRoute();
        return;
      }
      const i = Math.max(0, Math.min(index, circuits.length - 1));
      activeIndex = i;
      const c = circuits[i] || {};
      const pts = c.points || c.waypoints || c.polyline || c.latLngs || [];
      drawRoute(pts, true);
      notify('CIRCUIT_SELECTED', { index: i, id: c.id || '' });
    }

    window.mapBridge = {
      send(payload) {
        try {
          const data = typeof payload === 'string' ? JSON.parse(payload) : payload;
          const type = data && data.type ? String(data.type) : '';

          if (type === 'SET_CIRCUITS') {
            circuits = Array.isArray(data.circuits) ? data.circuits : [];
            activeIndex = Number.isFinite(data.activeIndex) ? Number(data.activeIndex) : 0;
            drawCircuit(activeIndex);
            return;
          }

          if (type === 'SELECT_CIRCUIT') {
            const idx = Number.isFinite(data.index) ? Number(data.index) : 0;
            drawCircuit(idx);
            return;
          }
        } catch (_) {
          // ignore malformed payload
        }
      }
    };

    window.showRoute = function showRoute(points) {
      drawRoute(points, true);
    };
  </script>
</body>
</html>
