name: covoiturage_lacite
description: Covoiturage La Cite Flutter app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  crypto: ^3.0.3
  flutter_secure_storage: ^9.0.0
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  flutter_map: ^6.1.0
  webview_flutter: ^4.8.0
  latlong2: ^0.9.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  geolocator: ^12.0.0
  path_provider: ^2.1.4
  sqflite: ^2.3.3+1
  path: ^1.9.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/homepagebackground.png
    - assets/web/map/index.html
