services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: lacite_postgres
    environment:
      POSTGRES_DB: Covoiturage_la_Cite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - lacite_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: lacite_mongo
    ports:
      - "27017:27017"
    volumes:
      - lacite_mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lacite_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  lacite_postgres_data:
  lacite_mongo_data:
